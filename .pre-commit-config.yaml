# Local gates. Gitleaks matches .github/workflows/gitleaks.yml.
# ShellCheck matches lint.yml: -S error; skip vendored Cursor skills.
# Install once after clone:  make pre-commit-install
# Skip one hook:             SKIP=gitleaks git commit ...
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-S", "error"]
        exclude: ^home/\.cursor/skills/
