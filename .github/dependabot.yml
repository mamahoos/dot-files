version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - github-actions

    commit-message:
      prefix: "chore"

  # Bumps `rev:` in /.pre-commit-config.yaml (e.g. gitleaks v8.30.1).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 5

    labels:
      - dependencies

    commit-message:
      prefix: "chore"

