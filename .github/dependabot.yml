version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - github-actions

    commit-message:
      prefix: "chore"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 2

    labels:
      - dependencies
      - docker

    commit-message:
      prefix: "chore"
