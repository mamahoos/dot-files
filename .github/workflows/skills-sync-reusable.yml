name: Reusable skills sync PR

# Requires repository secret SKILLS_SYNC_TOKEN (fine-grained PAT with Contents +
# Pull requests write). Using a PAT instead of GITHUB_TOKEN ensures lint and
# skills-drift workflows run on the opened sync PR.

on:
  workflow_call:
    inputs:
      trigger_label:
        description: Why this sync was triggered
        required: true
        type: string
    secrets:
      sync_token:
        description: PAT used to push the sync branch and open the PR
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skills-sync-pr
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.sync_token }}

      - name: Remove stale sync branch
        run: git push origin --delete chore/sync-agent-skills || true

      - name: Fetch upstream agent-skills
        id: upstream
        run: |
          git clone --depth 1 https://github.com/addyosmani/agent-skills.git /tmp/agent-skills
          echo "sha=$(git -C /tmp/agent-skills rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync skills into working tree
        env:
          AGENT_SKILLS_DIR: /tmp/agent-skills
        run: ./scripts/sync-agent-skills.sh

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.sync_token }}
          branch: chore/sync-agent-skills
          commit-message: "chore(cursor): sync agent-skills from upstream"
          title: "chore(cursor): sync agent-skills from upstream"
          body: |
            Automated sync from [addyosmani/agent-skills](https://github.com/addyosmani/agent-skills) at `${{ steps.upstream.outputs.sha }}`.

            Triggered by: ${{ inputs.trigger_label }}

            Review the diff and merge if it looks good.

            CI (`lint`, `check-skills-drift`, `Gitleaks`) runs on this PR because it is opened with `SKILLS_SYNC_TOKEN` instead of the default `GITHUB_TOKEN`.
          labels: chore, automated
          delete-branch: true
