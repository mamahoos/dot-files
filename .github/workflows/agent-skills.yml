name: Agent skills

# Required drift check only. Opening sync PRs lives in agent-skills-sync.yml
# so skipped sync jobs are not attached to every push/PR SHA (GitHub counts
# skipped jobs in the commit X/Y total).
#
# Do not listen to `closed`: a skipped required check (check-skills-drift) is a
# red X on the merged PR. Branch delete lives in delete-merged-sync-branch.yml.

on:
  # Required check: do not path-filter PRs or GitHub waits forever for this status.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - home/.cursor/skills/**
      - .github/upstreams/**
      - .github/scripts/sync-upstreams.sh
      - .github/workflows/agent-skills.yml
  workflow_dispatch:

concurrency:
  group: agent-skills-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-skills-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check skills drift against upstreams
        run: ./.github/scripts/sync-upstreams.sh --check --pull
