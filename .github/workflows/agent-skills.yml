name: Agent skills

# Multi-source upstream mirror: check → sync PR per source (on drift) → verify after merge.
# Merged chore/sync-* PRs with the automated label have their head branch deleted.
#
# Requires secret SKILLS_SYNC_TOKEN (PAT with Contents + Pull requests write)
# so lint and check-skills-drift run on automated sync PRs.

on:
  # Required check: do not path-filter PRs or GitHub waits forever for this status.
  # `closed` is for deleting merged chore/sync-* branches; check-skills-drift skips it.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
    paths:
      - home/.cursor/skills/**
      - .github/upstreams/**
      - .github/scripts/sync-upstreams.sh
      - .github/workflows/agent-skills.yml
  schedule:
    # GitHub cron is UTC. Minutes 30 + hours 2,5,8,... = every 3h at :00 IRST
    # (UTC+3:30), including the old 09:00 slot (05:30 UTC).
    - cron: "30 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:

concurrency:
  group: agent-skills-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-skills-drift:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check skills drift against upstreams
        run: ./.github/scripts/sync-upstreams.sh --check --pull

  sync-matrix:
    needs: check-skills-drift
    if: >-
      failure() &&
      github.repository == 'mamahoos/dot-files' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.list.outputs.sources }}

    steps:
      - uses: actions/checkout@v7

      - name: List enabled sources
        id: list
        run: |
          {
            echo 'sources<<EOF'
            ./.github/scripts/sync-upstreams.sh --list-sources
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  sync-pr:
    needs: sync-matrix
    # always() is required: without it GHA skips this job when check-skills-drift
    # failed earlier in the workflow, even though sync-matrix succeeded.
    if: >-
      always() &&
      needs.sync-matrix.result == 'success' &&
      needs.sync-matrix.outputs.sources != '' &&
      needs.sync-matrix.outputs.sources != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.sync-matrix.outputs.sources) }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SKILLS_SYNC_TOKEN }}

      - name: Remove stale sync branch
        run: git push origin --delete "chore/sync-${{ matrix.source }}" || true

      - name: Sync source into working tree
        id: sync
        run: |
          ./.github/scripts/sync-upstreams.sh --pull --source "${{ matrix.source }}"
          sha="$(git -C ".cache/upstreams/${{ matrix.source }}" rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve trigger label
        id: trigger
        run: |
          case "${{ github.event_name }}" in
            push) echo "label=drift on push to main (run ${{ github.run_id }})" >> "$GITHUB_OUTPUT" ;;
            schedule) echo "label=every-3h schedule (IRST :00)" >> "$GITHUB_OUTPUT" ;;
            *) echo "label=manual dispatch (run ${{ github.run_id }})" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SKILLS_SYNC_TOKEN }}
          branch: chore/sync-${{ matrix.source }}
          commit-message: "chore(cursor): sync ${{ matrix.source }} from upstream"
          title: "chore(cursor): sync ${{ matrix.source }} from upstream"
          body: |
            Automated sync of `${{ matrix.source }}` at `${{ steps.sync.outputs.sha }}`.

            Triggered by: ${{ steps.trigger.outputs.label }}

            Review the diff and merge if it looks good.

            CI runs on this PR via `SKILLS_SYNC_TOKEN` (`lint`, `check-skills-drift`, `Gitleaks`).
          labels: chore, automated
          assignees: mamahoos
          delete-branch: true

  # create-pull-request's delete-branch only runs when that action runs again
  # (empty PR / next drift). After a successful merge there is no drift, so
  # delete the head branch here instead.
  delete-merged-sync-branch:
    if: >-
      github.repository == 'mamahoos/dot-files' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'chore/sync-') &&
      contains(github.event.pull_request.labels.*.name, 'automated')
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged sync branch
        env:
          GH_TOKEN: ${{ secrets.SKILLS_SYNC_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^chore/sync-[a-z0-9][a-z0-9.-]*$ ]]; then
            echo "skip: not a skills sync branch: $BRANCH"
            exit 0
          fi
          if output="$(gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" 2>&1)"; then
            echo "deleted origin/${BRANCH}"
          elif grep -Eq 'HTTP 404|Not Found|Reference does not exist' <<<"$output"; then
            echo "already gone: origin/${BRANCH}"
          else
            printf '%s\n' "$output" >&2
            exit 1
          fi
