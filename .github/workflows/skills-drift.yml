name: Skills drift

# Detect → remediate → verify pipeline for upstream agent-skills.
#
#   check-skills-drift  — gate: fail when local skills differ from upstream
#   open-sync-pr        — remediate: only after check fails on main
#   (post-merge)        — verify: push to main re-runs check; should pass
#
# Upstream-only moves with no main activity are covered by skills-sync-pr.yml
# (daily schedule + manual dispatch).

on:
  pull_request:
    paths:
      - home/.cursor/skills/**
      - scripts/sync-agent-skills.sh
      - .github/workflows/skills-drift.yml
      - .github/workflows/skills-sync-pr.yml
      - .github/workflows/skills-sync-reusable.yml
  push:
    branches: [main]
    paths:
      - home/.cursor/skills/**
      - scripts/sync-agent-skills.sh
      - .github/workflows/skills-drift.yml
      - .github/workflows/skills-sync-pr.yml
      - .github/workflows/skills-sync-reusable.yml
  workflow_dispatch:

concurrency:
  group: skills-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-skills-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Fetch upstream agent-skills
        run: git clone --depth 1 https://github.com/addyosmani/agent-skills.git /tmp/agent-skills

      - name: Check home/.cursor/skills drift
        env:
          AGENT_SKILLS_DIR: /tmp/agent-skills
        run: ./scripts/sync-agent-skills.sh --check

  open-sync-pr:
    needs: check-skills-drift
    if: >-
      failure() &&
      github.repository == 'mamahoos/dot-files' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/skills-sync-reusable.yml
    with:
      trigger_label: skills-drift failure on main (run ${{ github.run_id }})
    secrets:
      sync_token: ${{ secrets.SKILLS_SYNC_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
