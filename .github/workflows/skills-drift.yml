name: Skills drift

on:
  pull_request:
    paths:
      - home/.cursor/skills/**
      - scripts/sync-agent-skills.sh
      - .github/workflows/skills-drift.yml
  push:
    branches: [ main ]
    paths:
      - home/.cursor/skills/**
      - scripts/sync-agent-skills.sh
      - .github/workflows/skills-drift.yml
  workflow_dispatch:
  # Scheduled drift detection lives in skills-sync-pr.yml, which opens a PR
  # when upstream moves ahead. This workflow keeps guarding against manual
  # local drift on PR/push.

concurrency:
  group: skills-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-skills-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Fetch upstream agent-skills
        run: git clone --depth 1 https://github.com/addyosmani/agent-skills.git /tmp/agent-skills

      - name: Check home/.cursor/skills drift
        env:
          AGENT_SKILLS_DIR: /tmp/agent-skills
        run: ./scripts/sync-agent-skills.sh --check
