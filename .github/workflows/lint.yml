name: Lint

on:
  push:
    branches: [main]
    paths:
      - home/**
      - install.sh
      - .github/scripts/**
      - .shellcheckrc
      - .github/workflows/lint.yml
  # Required check: do not path-filter PRs or GitHub waits forever for this status.
  # Omit `closed`: a cancelled/skipped required check on merge turns the PR red.
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: home
          severity: error
          ignore_paths: home/.cursor/skills

      - name: Run ShellCheck on repo scripts
        run: shellcheck -S error install.sh .github/scripts/*.sh

      - name: Install shfmt
        uses: mfinelli/setup-shfmt@v4
        with:
          shfmt-version: 3.8.0

      - name: Check formatting
        run: shfmt -d -i 2 install.sh .github/scripts
