name: Lint

on:
  push:
    branches: [ main ]
    paths:
      - home/**
      - scripts/**
      - .shellcheckrc
      - .github/workflows/lint.yml
  pull_request:
    paths:
      - home/**
      - scripts/**
      - .shellcheckrc
      - .github/workflows/lint.yml

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: home
          severity: error

      - name: Install shfmt
        uses: mfinelli/setup-shfmt@v4
        with:
          shfmt-version: 3.8.0

      - name: Check formatting
        run: shfmt -d -i 2 home scripts
