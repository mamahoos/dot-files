name: Skills sync PR

# Safety-net remediate when upstream moves but main stays quiet (no path-filtered push).
# Primary auto-fix lives in skills-drift.yml (open-sync-pr after check failure).

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC every day
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'mamahoos/dot-files'
    uses: ./.github/workflows/skills-sync-reusable.yml
    with:
      trigger_label: ${{ github.event_name == 'schedule' && 'daily schedule (09:00 UTC)' || 'manual workflow_dispatch' }}
    secrets:
      sync_token: ${{ secrets.SKILLS_SYNC_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
