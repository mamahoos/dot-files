# ======================================================================
# ~/.config/tmux/tmux.conf
# ----------------------------------------------------------------------
# Ghostty-green tmux. Palette matches config/ghostty/config.ghostty.
# Plugins live in ~/.local/share/tmux/plugins (not this repo).
# Prefix + I installs/updates TPM plugins after a first clone.
# ======================================================================


# ======================================================================
# Terminal / Ghostty
# ----------------------------------------------------------------------
# tmux-256color is the inner TERM. RGB/clipboard/passthrough apply to
# the outer client (xterm-ghostty). Passthrough + OSC 52 are what grok
# doctor expects; keep the marker blocks so it stays idempotent.
# ======================================================================

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:hyperlinks:extkeys"
set -as terminal-overrides ",xterm-ghostty:Tc"
set -g focus-events on
set -s escape-time 0
set -g set-titles on
set -g set-titles-string "#S:#I:#W — #h"

# >>> grok doctor >>>
# >>> terminal.tmux-clipboard >>>
set -g set-clipboard on
# <<< terminal.tmux-clipboard <<<
# >>> terminal.dcs-passthrough >>>
set -wg allow-passthrough on
# <<< terminal.dcs-passthrough <<<
# <<< grok doctor <<<


# ======================================================================
# Server / session
# ----------------------------------------------------------------------
# history-limit stays 5000 on purpose (memory cap). tmux-sensible would
# raise it to 50000 — override after TPM loads.
# ======================================================================

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g status-keys vi

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux.conf reloaded"


# ======================================================================
# Theme — ghostty-green
# ----------------------------------------------------------------------
# bg=default keeps Ghostty glass (opacity/blur) visible through the bar.
# Current window uses selection colours; session chip uses palette green.
# ======================================================================

set -g status-position top
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=default,fg=#B8E8BC"
set -g status-left-length 32
set -g status-right-length 120

set -g status-left "#[fg=#020603,bg=#4ED66D,bold] #S #[fg=#4ED66D,bg=default]"
set -g status-right "#[fg=#5C8FD6]#{net_speed}#[fg=#28402C] | #{cpu_fg_color}CPU #{cpu_percentage}#[fg=#28402C] | #{ram_fg_color}RAM #{ram_percentage}#[fg=#28402C] | #[fg=#B8E8BC]#(cut -d' ' -f1 /proc/loadavg)#[fg=#28402C] | #[fg=#7CFF88]%H:%M:%S "

setw -g window-status-separator ""
setw -g window-status-style "bg=default,fg=#28402C"
setw -g window-status-format "  #I:#W  "
setw -g window-status-current-style "bg=#145C25,fg=#E8FFE9,bold"
setw -g window-status-current-format "  #I:#W  "

set -g pane-border-style "fg=#28402C"
set -g pane-active-border-style "fg=#4ED66D"
set -g message-style "bg=#145C25,fg=#E8FFE9"
set -g message-command-style "bg=#145C25,fg=#E8FFE9"
setw -g mode-style "bg=#145C25,fg=#E8FFE9"
set -g clock-mode-colour "#7CFF88"
set -g clock-mode-style 24
set -g display-panes-colour "#28402C"
set -g display-panes-active-colour "#7CFF88"


# ======================================================================
# Plugins
# ----------------------------------------------------------------------
# tmux-autoreload needs `entr` (installed). CPU/RAM colours follow the
# same green → yellow → red ramp as config/btop/themes/ghostty-green.theme.
# ======================================================================

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-sidebar"
set -g @plugin "tmux-plugins/tmux-cowboy"
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "tmux-plugins/tmux-net-speed"
set -g @plugin "b0o/tmux-autoreload"

set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"

set -g @cpu_percentage_format "%5.1f%%"
set -g @ram_percentage_format "%5.1f%%"
set -g @cpu_low_fg_color "#[fg=#4ED66D]"
set -g @cpu_medium_fg_color "#[fg=#E5F56B]"
set -g @cpu_high_fg_color "#[fg=#FF6B6B]"
set -g @cpu_low_bg_color "#[bg=default]"
set -g @cpu_medium_bg_color "#[bg=default]"
set -g @cpu_high_bg_color "#[bg=default]"
set -g @ram_low_fg_color "#[fg=#4ED66D]"
set -g @ram_medium_fg_color "#[fg=#E5F56B]"
set -g @ram_high_fg_color "#[fg=#FF6B6B]"
set -g @ram_low_bg_color "#[bg=default]"
set -g @ram_medium_bg_color "#[bg=default]"
set -g @ram_high_bg_color "#[bg=default]"

set -g @net_speed_format "D:%8s U:%8s"


# ======================================================================
# TPM
# ----------------------------------------------------------------------
# Clone TPM on first start. `run` must stay after the plugin list.
# Options that sensible would clobber come after `run`.
# ======================================================================

if-shell "test ! -d $HOME/.local/share/tmux/plugins/tpm" \
  "run-shell 'git clone --depth 1 https://github.com/tmux-plugins/tpm $HOME/.local/share/tmux/plugins/tpm'"

run-shell "$HOME/.local/share/tmux/plugins/tpm/tpm"

set -g history-limit 5000
set -g status-interval 2
set -g default-terminal "tmux-256color"
setw -g mode-keys vi
set -g status-keys vi
